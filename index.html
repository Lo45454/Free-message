<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10172c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Free Message</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<header><h1>Free Message</h1><span id="me"></span><button id="logout" hidden>Déconnexion</button></header><p id="notice" role="status" aria-live="polite"></p>
<section id="auth"><h2>Bienvenue</h2><label for="username">Identifiant</label><input id="username" placeholder="Identifiant" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"><label for="password">Mot de passe</label><input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password"><button id="login">Connexion</button><button id="signup">Créer un compte</button></section>
<div id="app" hidden><aside><h2>Amis</h2><input id="search" placeholder="Identifiant exact" aria-label="Chercher un identifiant" autocapitalize="none" autocorrect="off" spellcheck="false"><button id="find">Chercher</button><div id="results"></div><h3>Demandes et amis</h3><div id="friends"></div></aside><main><button id="back" type="button">← Amis</button><h2 id="title">Choisis un ami</h2><div id="chat" hidden><div class="call-actions"><button id="audioCall">Appel audio</button><button id="videoCall">Appel vidéo</button></div><div id="messages" aria-label="Messages"></div><form id="composer"><input id="text" maxlength="8000" placeholder="Ton message" aria-label="Ton message" enterkeyhint="send"><button>Envoyer</button></form><div class="voice-actions"><button id="record">🎤 Enregistrer</button><button id="stop" hidden>Arrêter et envoyer</button><button id="cancel" hidden>Annuler</button></div></div></main></div>
<section id="incoming" hidden><p id="caller"></p><button id="accept">Accepter</button><button id="reject">Refuser</button></section><section id="call" hidden><p id="callState"></p><video id="remote" autoplay playsinline></video><video id="local" autoplay playsinline muted></video><button id="hangup">Raccrocher</button></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="app.js"></script><script src="mobile.js" defer></script></body></html>
