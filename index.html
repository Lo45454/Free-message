<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Message</title><link rel="stylesheet" href="styles.css">
<body><header><h1>Free Message</h1><span id="me"></span><button id="logout" hidden>Déconnexion</button></header><p id="notice" role="status"></p>
<section id="auth"><h2>Bienvenue</h2><input id="username" placeholder="Identifiant" autocomplete="username"><input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password"><button id="login">Connexion</button><button id="signup">Créer un compte</button></section>
<div id="app" hidden><aside><h2>Amis</h2><input id="search" placeholder="Identifiant exact"><button id="find">Chercher</button><div id="results"></div><h3>Demandes et amis</h3><div id="friends"></div></aside><main><h2 id="title">Choisis un ami</h2><div id="chat" hidden><button id="audioCall">Appel audio</button><button id="videoCall">Appel vidéo</button><div id="messages"></div><form id="composer"><input id="text" maxlength="8000" placeholder="Ton message"><button>Envoyer</button></form><button id="record">🎤 Enregistrer</button><button id="stop" hidden>Arrêter et envoyer</button><button id="cancel" hidden>Annuler</button></div></main></div>
<section id="incoming" hidden><p id="caller"></p><button id="accept">Accepter</button><button id="reject">Refuser</button></section><section id="call" hidden><p id="callState"></p><video id="remote" autoplay playsinline></video><video id="local" autoplay playsinline muted></video><button id="hangup">Raccrocher</button></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="app.js"></script></body></html>
