<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova Messages</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="auth-screen" class="screen active">
    <div class="auth-card">
      <h1>Nova</h1>
      <p class="subtitle">Messages privés, audio et appels</p>
      <input id="username" placeholder="Nom d'utilisateur" autocomplete="username">
      <input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password">
      <button id="login-btn">Se connecter</button>
      <button id="signup-btn" class="secondary">Créer un compte</button>
      <p id="auth-error"></p>
    </div>
  </div>

  <div id="app-screen" class="screen">
    <aside class="sidebar">
      <header>
        <div>
          <h2>Nova</h2>
          <p id="current-user"></p>
        </div>
        <button id="logout-btn" title="Déconnexion">⎋</button>
      </header>
      <div class="search-box">
        <input id="user-search" placeholder="Chercher un contact...">
      </div>
      <div id="contact-list"></div>
    </aside>

    <main class="chat-area">
      <div id="empty-chat" class="empty-chat">
        <h3>Choisis un contact</h3>
        <p>Commence une conversation privée.</p>
      </div>

      <div id="chat-view" class="chat-view hidden">
        <header class="chat-header">
          <div>
            <h3 id="chat-name"></h3>
            <p id="chat-status"></p>
          </div>
          <div class="call-buttons">
            <button id="audio-call-btn">📞 Audio</button>
            <button id="video-call-btn">🎥 Vidéo</button>
          </div>
        </header>

        <div id="messages"></div>

        <div id="recording-bar" class="hidden">
          <span>● Enregistrement...</span>
          <button id="cancel-recording">Annuler</button>
        </div>

        <footer class="composer">
          <button id="record-btn" title="Message audio">🎤</button>
          <input id="message-input" placeholder="Écris un message...">
          <button id="send-btn">Envoyer</button>
        </footer>
      </div>

      <div id="call-view" class="call-view hidden">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
        <div class="call-controls">
          <button id="end-call-btn">Raccrocher</button>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
