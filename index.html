<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10172c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Free Message</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<header><a class="brand" href="#" aria-label="Free Message, accueil"><span class="brand-mark">f</span><span>free<span class="brand-light">message</span></span></a><div class="header-user"><label class="avatar-edit" title="Modifier ma photo"><img id="myAvatar" class="avatar" alt=""><input id="avatarInput" type="file" accept="image/*" hidden></label><span id="me"></span><button id="logout" hidden>Déconnexion</button></div></header><p id="notice" role="status" aria-live="polite"></p>
<section id="auth"><h2>Bienvenue</h2><label for="username">Identifiant</label><input id="username" placeholder="Identifiant" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"><label for="password">Mot de passe</label><input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password"><button id="login">Connexion</button><button id="signup">Créer un compte</button></section>
<div id="app" hidden><aside><div class="sidebar-heading"><div><p class="eyebrow">TON ESPACE</p><h2>Messages</h2></div><span class="online-dot"></span></div><label class="search-box"><span aria-hidden="true">⌕</span><input id="search" placeholder="Rechercher une personne…" aria-label="Rechercher une personne" autocapitalize="none" autocorrect="off" spellcheck="false"><button id="find" type="button" aria-label="Rechercher">↵</button></label><p class="search-hint">Cherche par identifiant pour ajouter un contact.</p><div id="results"></div><div class="section-label"><h3>Contacts</h3></div><div id="friends"></div></aside><main><div class="empty-state"><div class="empty-icon">✦</div><p class="eyebrow">TON ESPACE PERSONNEL</p><h2 id="title">Choisis un contact</h2><p class="empty-copy">Tes conversations apparaîtront ici.<br>Choisis un contact pour commencer à discuter.</p><div id="chat" hidden><div class="chat-top"><button id="back" type="button">← Contacts</button><div class="call-actions"><button id="audioCall">☎ <span>Audio</span></button><button id="videoCall">▣ <span>Vidéo</span></button></div></div><div id="messages" aria-label="Messages"></div><form id="composer"><label class="attach-button" for="fileInput" title="Joindre une photo ou un fichier">＋</label><input id="fileInput" type="file" accept="image/*,.pdf,.doc,.docx,.txt,.zip,.xlsx,.csv" hidden><input id="text" maxlength="8000" placeholder="Écris un message…" aria-label="Ton message" enterkeyhint="send"><button aria-label="Envoyer le message">↑</button></form><div class="voice-actions"><button id="record">🎤 Enregistrer un vocal</button><button id="stop" hidden>Arrêter et envoyer</button><button id="cancel" hidden>Annuler</button></div></div></div></main></div>
<section id="incoming" hidden><p id="caller"></p><button id="accept">Accepter</button><button id="reject">Refuser</button></section><section id="call" hidden><p id="callState"></p><video id="remote" autoplay playsinline></video><video id="local" autoplay playsinline muted></video><button id="hangup">Raccrocher</button></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="app.js"></script><script src="mobile.js" defer></script></body></html>
